<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#020403">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon_192.png">
    <title> Screen Gallery </title>
    <link rel="preconnect" href="https://fonts.googleapis.com ">
    <link rel="preconnect " href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body><canvas id="matrix" aria-label="Animated screensaver"></canvas><canvas id="webglLayer"></canvas>
    <main class="hud">
        <section class="brand"><span class="status-dot"></span><span id="sceneTitle">MATRIX FLOW</span></section>
        <section class="panel" id="panel">
            <div class="panel-top"><span>DISPLAY SETTINGS</span><button id="toggle" aria-label="Collapse settings">-</button></div>
            <div class="settings" id="settings">
				<label for="scene">SCREENSAVER</label>
				<select id="scene">
					<optgroup label="🧊 WEBGL OPTIMIZED" id="group-webgl"></optgroup>
					<optgroup label="⚡ TV 60FPS OPTIMIZED" id="group-tv"></optgroup>
					<optgroup label="🔥 PC / FULL GRAPHICS" id="group-pc"></optgroup>
				</select>
				<label for="theme">COLOR THEME</label>
				<select id="theme">
					<option value="normal">Normal</option>
					<option value="random">Random preset / 12 sec</option>
					
					<!-- 🎲 กลุ่มสุ่มตามหมวดหมู่ (จะถูกสร้างอัตโนมัติจาก JS) -->
					<optgroup label="── RANDOM CATEGORIES ──" id="randomOptGroup">
						<option value="random3Colors">Random 3 Colors (30s)</option>
						<option value="randomTheme">Random Theme (All) (30s)</option>
					</optgroup>

					<!-- 🎨 รายชื่อ Theme เดี่ยวๆ (จะถูกสร้างอัตโนมัติจาก JS) -->
					<optgroup label="── SINGLE PALETTES ──" id="singleOptGroup"></optgroup>
				</select>
				<label for="sound">AMBIENT SOUND</label>
				<select id="sound"></select>
				<label for="colorPicker">ACCENT COLOR</label>
                <div class="color-row">
					<input type="color" id="colorPicker" value="#36f76d">
					<input id="colorText" maxlength="7" value="#36F76D">
				</div>
				<label for="speed">ANIMATION SPEED
					<output id="speedValue">1.0x</output>
				</label>
				<input type="range" id="speed" min="0.25" max="2" step="0.05" value="1">
				<label for="density">DENSITY
					<output id="densityValue">Normal</output>
				</label>
				<input type="range" id="density" min="12" max="42" step="1" value="24">
				<div class="presets">
					<button class="swatch active" data-color="#36F76D" style="--swatch:#36F76D" aria-label="Green accent"></button>
					<button class="swatch" data-color="#35D7FF" style="--swatch:#35D7FF" aria-label="Blue accent"></button>
					<button class="swatch" data-color="#C77DFF" style="--swatch:#C77DFF" aria-label="Purple accent"></button>
					<button class="swatch" data-color="#FF4D7D" style="--swatch:#FF4D7D" aria-label="Pink accent"></button>
					<button class="swatch" data-color="#FFB347" style="--swatch:#FFB347" aria-label="Orange accent"></button>
				</div>
            </div>
        </section>
		<div id="fpsCounter">FPS 60</div>
        <div class="hint">REMOTE: <kbd>↑↓</kbd> SELECT · <kbd>←→</kbd> ADJUST · <kbd>OK</kbd> ACTIVATE · <kbd>BACK</kbd> HIDE</div>
    </main>
    <button id="uiVisibilityToggle" class="ui-visibility-toggle" type="button" aria-pressed="false" aria-label="Hide controls">HIDE CONTROLS</button>
    <script src="script.js"></script>
</body>

</html>
