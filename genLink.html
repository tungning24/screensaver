<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Link Generator</title>
<style>
body{
    font-family: Arial, sans-serif;
    padding:20px;
}
textarea{
    width:100%;
    height:80px;
}
input[type=number]{
    width:100px;
}
#result{
    margin-top:20px;
    border:1px solid #ccc;
    padding:10px;
    max-height:400px;
    overflow:auto;
}
.link-item{
    margin:3px 0;
}
tabs{
    margin-bottom:15px;
}
.tab-btn{
    padding:8px 15px;
    cursor:pointer;
    border:1px solid #ccc;
    background:#eee;
}
.tab-btn.active{
    background:#4caf50;
    color:#fff;
}
.tab-content{
    display:none;
}
.tab-content.active{
    display:block;
}

#paletteInput{
    width:100%;
    height:220px;
}

#paletteResult{
    margin-top:15px;
    border:1px solid #ccc;
    padding:10px;
    white-space:pre-wrap;
    font-family:Consolas, monospace;
}
</style>
</head>
<body>

<div class="tabs">
    <button class="tab-btn active" onclick="showTab(1,this)">Link Generator</button>
    <button class="tab-btn" onclick="showTab(2,this)">Palette Converter</button>
</div>

<!-- TAB 1 https://mynoise.net/-->
<div id="tab1" class="tab-content active">

<h2>Link Generator</h2>

<label>Template</label><br>
<textarea id="template"></textarea><br><br>

<button onclick="insertGenNum()">แทรก [genNum]</button>
<button id="copyBtn" onclick="copyConsoleScript()">Copy Script</button>

<br><br>

<label>Start</label>
<input type="number" id="start" value="1">

<label>End</label>
<input type="number" id="end" value="10">

<button onclick="generateLinks()">สร้างลิงก์</button>

<div id="result"></div>

</div>

<!-- TAB 2 https://coolors.co/palettes/popular/violet -->
<div id="tab2" class="tab-content">

<h2>Palette Converter</h2>

<p>วาง HTML ของ palette-card</p>

<textarea id="paletteInput"></textarea>
<br><br>

<button onclick="convertPalette()">แปลง</button>
<button id="copyPaletteBtn" onclick="copyPaletteResult()">Copy</button>

<div id="paletteResult"></div>

</div>

<script>
function copyPaletteResult(){

    const text =
        document.getElementById("paletteResult").textContent.trim();

    if(!text){
        alert("ยังไม่มีผลลัพธ์");
        return;
    }

    navigator.clipboard.writeText(text).then(() => {

        const btn = document.getElementById("copyPaletteBtn");

        const oldText = btn.textContent;

        btn.textContent = "Copied! ✅";

        setTimeout(() => {
            btn.textContent = oldText;
        }, 2000);

    }).catch(err => {
        console.error(err);
        alert("Copy ไม่สำเร็จ");
    });
}
function showTab(tab, btn){

    document.querySelectorAll(".tab-content")
        .forEach(el => el.classList.remove("active"));

    document.querySelectorAll(".tab-btn")
        .forEach(el => el.classList.remove("active"));

    document.getElementById("tab"+tab)
        .classList.add("active");

    btn.classList.add("active");
}

function convertPalette(){

    const html = document.getElementById("paletteInput").value;

    // ชื่อ Palette
    let nameMatch = html.match(/palette-card_name[^>]*>(.*?)<\/a>/i);

    let paletteName = "Palette";

    if(nameMatch){
        paletteName = nameMatch[1]
            .replace(/[^a-zA-Z0-9 ]/g,"")
            .trim()
            .replace(/\s+/g,"");
    }

    // ดึง HEX ทั้งหมด
    const colors = [];

    const colorRegex = /<span>\s*([A-Fa-f0-9]{6})\s*<\/span>/g;

    let match;

    while((match = colorRegex.exec(html)) !== null){
        colors.push(`#${match[1].toUpperCase()}`);
    }

    const output =
        `${paletteName}: [${colors.map(c=>`'${c}'`).join(",")}]`;

    document.getElementById("paletteResult").textContent = output;
}
function copyConsoleScript() {
  // สคริปต์ที่ต้องการคัดลอก
  const scriptToCopy = `{
  // 1. ดึงข้อความจาก <div class="msg" id="msg"> มาทำ Title
  const msgEl = document.getElementById('msg');
  const msgText = msgEl ? msgEl.textContent.trim() : 'Natural';

  // 2. ดึงค่า % ทั้ง 10 ช่อง
  const levels = Array.from({ length: 10 }, (_, i) => {
    const el = document.getElementById(\`\s\${i}\`);
    if (!el) return 0;
    
    const handle = el.querySelector('.ui-slider-handle');
    const bottomVal = handle ? handle.style.bottom : '0%';
    
    return parseFloat(parseFloat(bottomVal).toFixed(2)) || 0;
  });

  // 3. สร้าง Key สำหรับใช้ใน JavaScript (ตัดเว้นวรรคและอักขระพิเศษออกเพื่อให้เป็น Valid Key)
  const safeKey = msgText.replace(/[^a-zA-Z0-9]/g, '');
  const objectKey = safeKey ? safeKey.charAt(0).toLowerCase() + safeKey.slice(1) : 'preset';

  // 4. จัดฟอร์แมตให้อยู่ในรูปโครงสร้าง Object ชุดใหม่
  const output = \`\${objectKey}: {\\n  title: '\${msgText}',\\n  levels: [\${levels.join(', ')}]\\n},\`;

  console.log(output);

  // 5. สั่ง Copy ลง Clipboard ทันที
  //navigator.clipboard.writeText(output).then(() => {
  copy(output);
  console.log("%c Copied to clipboard successfully! ✅", "color: #00ff00; font-weight: bold;");
}`;

  // สั่ง คัดลอก ลง Clipboard
  navigator.clipboard.writeText(scriptToCopy).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied! ✅';
    
    // คืนค่าข้อความปุ่มกลับมาเหมือนเดิมหลังจาก 2 วินาที
    setTimeout(() => {
      btn.textContent = 'Copy Script';
    }, 2000);
  }).catch(err => {
    console.error('Copy failed: ', err);
  });
}
function insertGenNum() {
    const txt = document.getElementById("template");

    const start = txt.selectionStart;
    const end = txt.selectionEnd;

    txt.value =
        txt.value.substring(0, start) +
        "[genNum]" +
        txt.value.substring(end);

    txt.focus();

    const pos = start + "[genNum]".length;
    txt.setSelectionRange(pos, pos);
}

function generateLinks() {
    const template = document.getElementById("template").value;
    const startNum = parseInt(document.getElementById("start").value);
    const endNum = parseInt(document.getElementById("end").value);

    const result = document.getElementById("result");
    result.innerHTML = "";

    for(let i = startNum; i <= endNum; i++) {

        const url = template.replaceAll("[genNum]", i);

        const div = document.createElement("div");
        div.className = "link-item";

        div.innerHTML =
            `<a href="${url}" target="_blank">${url}</a>`;

        result.appendChild(div);
    }
}
</script>

</body>
</html>
